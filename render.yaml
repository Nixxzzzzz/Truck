services:
  - type: web
    name: truck-manager
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truck-manager-db
          property: connectionString
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_HOURS
        value: "12"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: truck-manager-db
    plan: free